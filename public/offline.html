<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline - KOLASE</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Nunito', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #fff5f7 0%, #ffeef2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-center;
            padding: 2rem;
        }

        .container {
            text-align: center;
            max-width: 500px;
        }

        .icon {
            font-size: 6rem;
            margin-bottom: 2rem;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        h1 {
            color: #d14060;
            font-size: 2.5rem;
            margin-bottom: 1rem;
        }

        p {
            color: #7a6168;
            font-size: 1.125rem;
            line-height: 1.6;
            margin-bottom: 2rem;
        }

        .btn {
            display: inline-block;
            padding: 1rem 2rem;
            background: linear-gradient(135deg, #ff6b8a 0%, #e85575 100%);
            color: white;
            text-decoration: none;
            border-radius: 1rem;
            font-weight: 600;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 10px 30px -10px rgba(255, 107, 138, 0.3);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 40px -10px rgba(255, 107, 138, 0.4);
        }

        .status {
            margin-top: 2rem;
            padding: 1rem;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 0.75rem;
            font-size: 0.875rem;
            color: #7a6168;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">📡</div>
        <h1>Anda Sedang Offline</h1>
        <p>
            Maaf, sepertinya Anda tidak terhubung ke internet. Beberapa fitur mungkin tidak tersedia saat offline.
        </p>
        <a href="/" class="btn" onclick="window.location.reload(); return false;">
            Coba Lagi
        </a>
        <div class="status">
            <strong>KOLASE</strong> - Konselor Menyusui Sepanjang
        </div>
    </div>

    <script>
        // Auto-retry ketika online
        window.addEventListener('online', () => {
            window.location.reload();
        });

        // Check connection status
        setInterval(() => {
            if (navigator.onLine) {
                window.location.reload();
            }
        }, 5000);
    </script>
</body>
</html>
